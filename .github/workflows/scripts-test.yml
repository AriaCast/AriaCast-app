name: Scripts

on:
  push:
    paths: ["scripts/**", "data/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths: ["scripts/**", "data/**", ".github/ISSUE_TEMPLATE/**"]

jobs:
  speaker-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B -m unittest discover -s scripts -p "test_*.py" -v
