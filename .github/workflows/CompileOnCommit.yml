name: Android Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest

      # Both flavors (github, fdroid), debug only
      - name: Build APKs
        run: ./gradlew assembleDebug

      # Debug APKs are "AriaCast Test": a separate app (com.aria.ariacast.test) signed with the
      # debug key, so testers can install it next to the real app without touching its data.
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
