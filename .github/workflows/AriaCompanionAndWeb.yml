name: AriaCompanion firmware and web remote

on:
  push:
    branches: [ "main" ]
    paths: [ "AriaCompanion/**", "web-remote/**", ".github/workflows/AriaCompanionAndWeb.yml" ]
  pull_request:
    paths: [ "AriaCompanion/**", "web-remote/**" ]

jobs:
  firmware:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Host-side unit tests
        run: make -C AriaCompanion/firmware/test

      - name: Install the ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      - name: Fetch the Pico SDK (2.1.1, with TinyUSB)
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb

      - name: Build
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S AriaCompanion/firmware -B build -G Ninja
          ninja -C build
          sha256sum build/aria_companion.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: aria_companion-uf2
          path: build/aria_companion.uf2

  firmware-bt:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build the ESP32 Bluetooth firmware (ESP-IDF 5.5)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          path: AriaCompanion/firmware-bt

      - uses: actions/upload-artifact@v4
        with:
          name: aria_companion_bt
          path: |
            AriaCompanion/firmware-bt/build/aria_companion_bt.bin
            AriaCompanion/firmware-bt/build/bootloader/bootloader.bin
            AriaCompanion/firmware-bt/build/partition_table/partition-table.bin
            AriaCompanion/firmware-bt/build/flasher_args.json

  web-remote:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-remote/package-lock.json
      - name: Build
        working-directory: web-remote
        run: npm ci && npm run build
      - name: The committed build is up to date
        run: git diff --exit-code -- app/src/main/assets/web || (echo "Run 'npm run build' in web-remote/ and commit app/src/main/assets/web" && exit 1)
