name: Speaker report
description: Tell us how a speaker works, or doesn't, with AriaCast
title: "Speaker: "
labels: ["speaker-report"]
body:
  - type: markdown
    attributes:
      value: |
        A bot reads this and updates the [list](../blob/main/README.md): if the speaker is already there your
        report is counted, if not it is added. **Only the fields below are used; the log is never copied into the list.**
        The AriaCast app fills most of this in for you (long-press a speaker, **Report speaker**).
  - type: input
    id: speaker
    attributes:
      label: Speaker
      description: Brand and model, for example "WiiM Pro Plus".
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - AirPlay 2
        - AirPlay 1
        - DLNA
        - Google Cast
        - No local protocol
        - Other
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: How does it work?
      options:
        - Supported
        - Supported with quirks
        - Unsupported
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: What happens
      description: What you see or hear when something goes wrong, one thing per line. Needed for a speaker that is not plain "Supported" and is not in the list yet.
  - type: textarea
    id: details
    attributes:
      label: Speaker details
      description: Filled in by the app. Addresses are shortened.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: The app copied it for you; paste it here. It stays in this issue and is not added to the list.
      render: text
  - type: input
    id: version
    attributes:
      label: AriaCast version
